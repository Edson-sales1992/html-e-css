<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteador de Times</title><link rel="shortcut icon" href="soccer-ball.png" type="image/x-icon">

<link rel="manifest" href="manifest.json">

<style>
body {
  background: linear-gradient(135deg, #1e1e2f, #121212);
  font-family: Arial;
  color: white;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
}

textarea, input, button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #2196f3;
  color: white;
  font-weight: bold;
}

.times {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.time {
  flex: 1;
  background: #2a2a3d;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>
<div class="container">

<h2>⚽ Sorteador de Times</h2>

<label>Número total de jogadores:</label>
<input type="number" id="total" value="14">

<textarea id="nomes" placeholder="Digite os nomes..."></textarea>

<button onclick="sortear()">🎲 Sortear</button>

<div class="times">
  <div class="time">
    <h3>🔵 Azul</h3>
    <div id="azul"></div>
  </div>
  <div class="time">
    <h3>🟠 Laranja</h3>
    <div id="laranja"></div>
  </div>
</div>

</div>

<script>
function sortear() {
  let total = parseInt(document.getElementById("total").value);
  let nomes = document.getElementById("nomes").value
    .split("\n")
    .filter(n => n.trim() !== "");

  if (nomes.length !== total) {
    alert("Quantidade de nomes diferente do total informado!");
    return;
  }

  if (total % 2 !== 0) {
    alert("O número total deve ser PAR!");
    return;
  }

  let goleiros = nomes.filter(n => n.includes("(G)"));
  let jogadores = nomes.filter(n => !n.includes("(G)"));

  if (goleiros.length !== 2) {
    alert("Marque exatamente 2 goleiros com (G)!");
    return;
  }

  jogadores.sort(() => Math.random() - 0.5);
  goleiros.sort(() => Math.random() - 0.5);

  let metade = total / 2;

  let timeAzul = [goleiros[0], ...jogadores.slice(0, metade - 1)];
  let timeLaranja = [goleiros[1], ...jogadores.slice(metade - 1)];

  document.getElementById("azul").innerHTML = timeAzul.join("<br>");
  document.getElementById("laranja").innerHTML = timeLaranja.join("<br>");
}
</script>

</body>
</html>

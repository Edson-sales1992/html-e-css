<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>exemplos de formularios</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
       <fieldset> <!--fieldset cria uma borda em volta-->
        <legend>Informações Pessoais</legend>
           <p><label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
               </p>
               <p>
            <label for="iemail">email</label>
            <input type="email" name="email" id="iemail" required autocomplete="email">
               </p>
               <p>
            <label for="itel">Telefone</label>
            <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required placeholder="(xx)xxxxx-xxxx">
               </p>
       </fieldset>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
   
</body>
</html>
